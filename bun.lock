import React, { useState, useRef, useEffect } from "react";
import { ChevronDown, Check, Mic, Sparkles, Star, User, X } from "lucide-react";
import { VOICE_PROFILES, VoiceProfile, getRecommendedVoicesForNiche } from "../lib/videoEngine";

interface VoiceTalentDropdownProps {
  value: string;
  onChange: (value: string) => void;
  niche?: string;
  className?: string;
  style?: React.CSSProperties;
  buttonHeight?: string;
}

export const VoiceTalentDropdown: React.FC<VoiceTalentDropdownProps> = ({
  value,
  onChange,
  niche = "",
  className = "",
  style,
  buttonHeight = "auto"
}) => {
  const [isOpen, setIsOpen] = useState(false);
  const containerRef = useRef<HTMLDivElement>(null);
  const [isMobile, setIsMobile] = useState<boolean>(() => 
    typeof window !== "undefined" ? window.innerWidth < 768 : false
  );
  
  const [dropdownCoords, setDropdownCoords] = useState<{
    top: number;
    left: number;
    width: number;
    maxHeight: number;
  }>({ top: 0, left: 0, width: 0, maxHeight: 320 });

  const updatePosition = () => {
    const mobileCheck = window.innerWidth < 768;
    setIsMobile(mobileCheck);

    if (!mobileCheck && containerRef.current) {
      const rect = containerRef.current.getBoundingClientRect();
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      const padding = 12;
      const targetWidth = Math.min(
        Math.max(260, rect.width),
        viewportWidth - padding * 2
      );

      let left = rect.left;
      if (left + targetWidth > viewportWidth - padding) {
        left = viewportWidth - targetWidth - padding;
      }
      if (left < padding) {
        left = padding;
      }

      const spaceBelow = viewportHeight - rect.bottom - 12;
      const spaceAbove = rect.top - 12;
      let top = rect.bottom + 4;
      let maxHeight = 340;

      if (spaceBelow < 220 && spaceAbove > spaceBelow) {
        maxHeight = Math.min(340, spaceAbove);
        top = Math.max(padding, rect.top - maxHeight - 4);
      } else {
        maxHeight = Math.min(340, spaceBelow);
      }

      setDropdownCoords({
        top: Math.max(padding, top),
        left: Math.max(padding, left),
        width: Math.max(220, targetWidth),
        maxHeight: Math.max(180, maxHeight)
      });
    }
  };

  useEffect(() => {
    const handleResize = () => {
      setIsMobile(window.innerWidth < 768);
      if (isOpen) updatePosition();
    };

    if (isOpen) {
      updatePosition();
      window.addEventListener("scroll", updatePosition, true);
      window.addEventListener("resize", handleResize);
    }
    return () => {
      window.removeEventListener("scroll", updatePosition, true);
      window.removeEventListener("resize", handleResize);
    };
  }, [isOpen]);

  useEffect(() => {
    const handleClickOutside = (event: MouseEvent) => {
      if (!isMobile && containerRef.current && !containerRef.current.contains(event.target as Node)) {
        const popover = document.getElementById("voice-talent-dropdown-popover");
        if (popover && popover.contains(event.target as Node)) {
          return;
        }
        setIsOpen(false);
      }
    };
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, [isMobile]);

  // Lock body scroll when mobile bottom sheet is open
  useEffect(() => {
    if (isOpen && isMobile) {
      document.body.style.overflow = "hidden";
    } else {
      document.body.style.overflow = "";
    }
    return () => {
      document.body.style.overflow = "";
    };
  }, [isOpen, isMobile]);

  const recommendedVoices = niche ? getRecommendedVoicesForNiche(niche) : [];
  const recommendedIds = new Set(recommendedVoices.map(v => v.id));

  // Find currently selected voice profile object or default display
  const currentVoiceObj = VOICE_PROFILES.find(
    v => v.name === value || v.name.toLowerCase().startsWith(value.split(" ")[0].toLowerCase())
  );

  const formattedNicheName = niche
    ? niche.split(" ")[0].replace(/[^a-zA-Z0-9]/g, "")
    : "";

  return (
    <div
      ref={containerRef}
      className={`relative w-full min-w-0 flex-1 ${className}`}
    >
      {/* Trigger Button */}
      <button
        type="button"
        onClick={() => setIsOpen(!isOpen)}
        style={{
          width: "100%",
          background: "#181a24",
          border: "1px solid rgba(56, 189, 248, 0.35)",
          color: "#ffffff",
          padding: "10px 14px",
          borderRadius: "8px",
          outline: "none",
          fontSize: "12px",
          fontWeight: 600,
          fontFamily: '"Inter", system-ui, sans-serif',
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          cursor: "pointer",
          gap: "8px",
          height: buttonHeight,
          boxSizing: "border-box",
          ...style
        }}
        className="hover:border-cyan-400 transition-colors active:bg-slate-800"
      >
        <div className="flex items-center gap-1.5 min-w-0 overflow-hidden text-left">
          <Mic className="w-3.5 h-3.5 text-cyan-400 shrink-0" />
          <span className="truncate text-white font-semibold">
            {currentVoiceObj?.name || value || "Select Voice Talent"}
          </span>
          {currentVoiceObj && (
            <span className={`text-[9px] font-mono px-1.5 py-0.2 rounded shrink-0 font-bold ${
              currentVoiceObj.gender === "Male" 
                ? "bg-blue-500/20 text-blue-300 border border-blue-500/30" 
                : "bg-pink-500/20 text-pink-300 border border-pink-500/30"
            }`}>
              {currentVoiceObj.gender}
            </span>
          )}
        </div>
        <ChevronDown
          className={`w-4 h-4 text-cyan-400 shrink-0 transition-transform duration-200 ${
            isOpen ? "rotate-180" : ""
          }`}
        />
      </button>

      {/* Render Options: Mobile Bottom Sheet vs Desktop Floating Popover */}
      {isOpen && (
        isMobile ? (
          /* Mobile Bottom Sheet Overlay */
          <div className="fixed inset-0 z-[999999] flex flex-col justify-end bg-black/80 backdrop-blur-sm animate-in fade-in duration-200">
            {/* Backdrop Tap to Close */}
            <div 
              className="absolute inset-0" 
              onClick={() => setIsOpen(false)} 
            />

            {/* Bottom Sheet Container */}
            <div className="relative z-10 w-full max-h-[85vh] bg-[#0d101d] rounded-t-2xl border-t-2 border-cyan-500/60 shadow-2xl flex flex-col animate-in slide-in-from-bottom duration-250 pb-safe overflow-hidden">
              {/* Drag Handle & Header */}
              <div className="pt-2 px-4 pb-3 bg-slate-900/90 border-b border-white/10 shrink-0">
                <div className="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mb-2" />
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center">
                      <Mic className="w-4 h-4 text-cyan-400" />
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-white tracking-wide">10 Premium Voice Talents</h3>
                      <p className="text-[10px] text-cyan-300 font-mono">ElevenLabs Neural Speech API</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsOpen(false)}
                    className="p-2 text-slate-400 hover:text-white rounded-lg bg-slate-800/80 active:bg-slate-700 transition-colors"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>
              </div>

              {/* Scrollable Content List optimized for touch navigation */}
              <div className="p-3 space-y-3 overflow-y-auto max-h-[calc(85vh-75px)] scrollbar-thin scrollbar-thumb-cyan-500/40">
                {/* Recommended Section for Selected Niche */}
                {recommendedVoices.length > 0 && (
                  <div className="space-y-1.5 pb-2 border-b border-white/10">
                    <div className="px-1 py-1 text-[11px] font-mono font-bold uppercase tracking-wider text-amber-300 flex items-center gap-1.5">
                      <Sparkles className="w-3.5 h-3.5 text-amber-400 animate-pulse" />
                      <span>Recommended for {formattedNicheName || "Your Niche"}</span>
                    </div>
                    {recommendedVoices.map((voice) => {
                      const isSelected = value === voice.name || value.includes(voice.name.split(" ")[0]);
                      return (
                        <button
                          key={`mobile-rec-${voice.id}`}
                          type="button"
                          onClick={() => {
                            onChange(voice.name);
                            setIsOpen(false);
                          }}
                          style={{
                            backgroundColor: isSelected ? "rgba(6, 182, 212, 0.25)" : "rgba(245, 158, 11, 0.1)"
                          }}
                          className={`w-full text-left p-3.5 rounded-xl transition-all flex flex-col gap-1.5 cursor-pointer border min-h-[52px] ${
                            isSelected
                              ? "border-cyan-400 shadow-md shadow-cyan-500/20"
                              : "border-amber-500/30 active:bg-amber-500/20"
                          }`}
                        >
                          <div className="flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2 min-w-0">
                              <Star className="w-4 h-4 text-amber-400 fill-amber-400 shrink-0" />
                              <span className="font-bold text-sm text-amber-200 truncate">{voice.name}</span>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                              <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full font-bold ${
                                voice.gender === "Male" 
                                  ? "bg-blue-500/25 text-blue-300 border border-blue-500/40" 
                                  : "bg-pink-500/25 text-pink-300 border border-pink-500/40"
                              }`}>
                                {voice.gender}
                              </span>
                              {isSelected && <Check className="w-5 h-5 text-cyan-300 shrink-0" />}
                            </div>
                          </div>
                          <p className="text-xs text-slate-300 font-normal leading-relaxed pl-6">
                            {voice.description}
                          </p>
                        </button>
                      );
                    })}
                  </div>
                )}

                {/* All Voice Profiles Section Header */}
                <div className="px-1 pt-1 text-[11px] font-mono font-semibold uppercase tracking-wider text-slate-400">
                  All 10 Voice Profiles
                </div>

                {/* All 10 Voice Profiles List */}
                <div className="space-y-2">
                  {VOICE_PROFILES.map((voice) => {
                    const isSelected = value === voice.name || value.includes(voice.name.split(" ")[0]);
                    const isRecommended = recommendedIds.has(voice.id);
                    return (
                      <button
                        key={`mobile-all-${voice.id}`}
                        type="button"
                        onClick={() => {
                          onChange(voice.name);
                          setIsOpen(false);
                        }}
                        style={{
                          backgroundColor: isSelected ? "rgba(6, 182, 212, 0.22)" : "rgba(30, 41, 59, 0.4)"
                        }}
                        className={`w-full text-left p-3.5 rounded-xl transition-all flex flex-col gap-1.5 cursor-pointer min-h-[52px] border ${
                          isSelected
                            ? "border-cyan-400 font-bold"
                            : "border-white/10 active:bg-slate-800"
                        }`}
                      >
                        <div className="flex items-center justify-between gap-2">
                          <div className="flex items-center gap-2 min-w-0">
                            <span className="font-semibold text-sm text-white truncate">{voice.name}</span>
                            {isRecommended && (
                              <span className="text-[10px] font-mono font-bold px-2 py-0.5 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded shrink-0">
                                TOP
                              </span>
                            )}
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full font-bold ${
                              voice.gender === "Male" 
                                ? "bg-blue-500/20 text-blue-300 border border-blue-500/30" 
                                : "bg-pink-500/20 text-pink-300 border border-pink-500/30"
                            }`}>
                              {voice.gender}
                            </span>
                            {isSelected && <Check className="w-5 h-5 text-cyan-300 shrink-0" />}
                          </div>
                        </div>
                        <p className="text-xs text-slate-300 font-normal leading-normal">
                          {voice.tone} — {voice.description}
                        </p>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        ) : (
          /* Desktop Floating Popover */
          <div
            id="voice-talent-dropdown-popover"
            style={{
              position: "fixed",
              top: `${dropdownCoords.top}px`,
              left: `${dropdownCoords.left}px`,
              width: `${dropdownCoords.width}px`,
              zIndex: 99999,
              backgroundColor: "#0d101d",
              border: "1.5px solid rgba(56, 189, 248, 0.5)",
              borderRadius: "10px",
              boxShadow: "0 16px 36px rgba(0, 0, 0, 0.95), 0 0 24px rgba(56, 189, 248, 0.2)",
              overflow: "hidden"
            }}
            className="animate-in fade-in zoom-in-95 duration-150 flex flex-col"
          >
            {/* Header Bar */}
            <div className="px-3 py-2 bg-slate-900 border-b border-white/15 flex items-center justify-between text-[11px] font-mono font-bold text-cyan-300 uppercase tracking-wider shrink-0">
              <span className="flex items-center gap-1.5 text-cyan-300 font-bold">
                <User className="w-3.5 h-3.5 text-cyan-400" /> 10 Premium Voice Talents
              </span>
              <span className="text-slate-400 font-normal">ElevenLabs AI</span>
            </div>

            {/* Options Scroll List */}
            <div
              style={{
                overflowY: "auto",
                maxHeight: `${dropdownCoords.maxHeight - 36}px`,
                padding: "6px"
              }}
              className="scrollbar-thin scrollbar-thumb-cyan-500/40 space-y-1 bg-[#0d101d]"
            >
              {/* Recommended Section for Selected Niche */}
              {recommendedVoices.length > 0 && (
                <div className="mb-2 pb-2 border-b border-white/10">
                  <div className="px-2.5 py-1 text-[10px] font-mono font-bold uppercase tracking-wider text-amber-300 flex items-center gap-1.5">
                    <Sparkles className="w-3 h-3 text-amber-400 animate-pulse" />
                    <span>Recommended for {formattedNicheName || "Your Niche"}</span>
                  </div>
                  <div className="space-y-1 mt-1">
                    {recommendedVoices.map((voice) => {
                      const isSelected = value === voice.name || value.includes(voice.name.split(" ")[0]);
                      return (
                        <button
                          key={`rec-${voice.id}`}
                          type="button"
                          onClick={() => {
                            onChange(voice.name);
                            setIsOpen(false);
                          }}
                          style={{
                            backgroundColor: isSelected ? "rgba(6, 182, 212, 0.25)" : "rgba(245, 158, 11, 0.08)"
                          }}
                          className={`w-full text-left p-2.5 rounded-lg transition-all flex flex-col gap-1 cursor-pointer border ${
                            isSelected
                              ? "border-cyan-400/80 shadow-sm shadow-cyan-500/20"
                              : "border-amber-500/25 hover:bg-amber-500/15 hover:border-amber-400/50"
                          }`}
                        >
                          <div className="flex items-center justify-between gap-2">
                            <div className="flex items-center gap-1.5 min-w-0">
                              <Star className="w-3.5 h-3.5 text-amber-400 fill-amber-400 shrink-0" />
                              <span className="font-bold text-xs text-amber-200 truncate">{voice.name}</span>
                            </div>
                            <div className="flex items-center gap-1 shrink-0">
                              <span className={`text-[9px] font-mono px-1.5 py-0.2 rounded font-bold ${
                                voice.gender === "Male" 
                                  ? "bg-blue-500/25 text-blue-300 border border-blue-500/40" 
                                  : "bg-pink-500/25 text-pink-300 border border-pink-500/40"
                              }`}>
                                {voice.gender}
                              </span>
                              {isSelected && <Check className="w-4 h-4 text-cyan-300 shrink-0" />}
                            </div>
                          </div>
                          <p className="text-[10px] text-slate-300 font-normal leading-tight line-clamp-1 pl-5">
                            {voice.description}
                          </p>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* All Voice Profiles Section Header */}
              {recommendedVoices.length > 0 && (
                <div className="px-2.5 py-1 text-[10px] font-mono font-semibold uppercase tracking-wider text-slate-400">
                  All Voice Profiles
                </div>
              )}

              {/* All 10 Voice Profiles */}
              {VOICE_PROFILES.map((voice) => {
                const isSelected = value === voice.name || value.includes(voice.name.split(" ")[0]);
                const isRecommended = recommendedIds.has(voice.id);
                return (
                  <button
                    key={voice.id}
                    type="button"
                    onClick={() => {
                      onChange(voice.name);
                      setIsOpen(false);
                    }}
                    style={{
                      backgroundColor: isSelected ? "rgba(6, 182, 212, 0.22)" : "transparent"
                    }}
                    className={`w-full text-left p-2.5 rounded-lg transition-all flex flex-col gap-1 cursor-pointer ${
                      isSelected
                        ? "border border-cyan-400/60 font-bold"
                        : "hover:bg-slate-800/90 hover:text-white active:bg-slate-700"
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-1.5 min-w-0">
                        <span className="font-semibold text-xs text-white truncate">{voice.name}</span>
                        {isRecommended && (
                          <span className="text-[9px] font-mono font-bold px-1.5 py-0.2 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded shrink-0">
                            BEST FIT
                          </span>
                        )}
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <span className={`text-[9px] font-mono px-1.5 py-0.2 rounded font-bold ${
                          voice.gender === "Male" 
                            ? "bg-blue-500/20 text-blue-300 border border-blue-500/30" 
                            : "bg-pink-500/20 text-pink-300 border border-pink-500/30"
                        }`}>
                          {voice.gender}
                        </span>
                        {isSelected && <Check className="w-4 h-4 text-cyan-300 shrink-0" />}
                      </div>
                    </div>
                    <p className="text-[10px] text-slate-400 font-normal leading-tight line-clamp-1">
                      {voice.tone} — {voice.description}
                    </p>
                  </button>
                );
              })}
            </div>
          </div>
        )
      )}
    </div>
  );
};

